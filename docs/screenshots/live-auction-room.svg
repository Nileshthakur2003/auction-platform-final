            <rect x="118" width="105" height="40" rx="8" fill="#020617" stroke="#334155"/>
            <text x="170" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">+₹5,000</text>

