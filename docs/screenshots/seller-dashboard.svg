<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="680" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="1200" height="42" rx="16" fill="#090d16"/>
  <rect y="30" width="1200" height="12" fill="#090d16"/>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>

  <!-- Address Bar -->
  <rect x="180" y="8" width="840" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="600" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">
    🔒 https://auctionhub.internal/seller
  </text>

  <!-- Main Canvas -->
  <g transform="translate(0, 42)">
    
  <!-- Sidebar -->
  <g transform="translate(0, 0)">
    <rect width="240" height="638" fill="#020617"/>
    <line x1="240" y1="0" x2="240" y2="638" stroke="#1e293b"/>

    <g transform="translate(24, 24)">
      <rect width="32" height="32" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="8" y="22" fill="#10b981" font-size="16">🔨</text>
      <text x="42" y="16" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">AuctionHub</text>
      <text x="42" y="30" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">SELLER PORTAL</text>
    </g>

    <!-- User Card -->
    <rect x="16" y="74" width="208" height="84" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="28" y="94" fill="#64748b" font-family="sans-serif" font-size="10">Signed in as</text>
    <text x="28" y="112" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">consignor_apex</text>
    <rect x="28" y="124" width="184" height="24" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="120" y="140" fill="#a7f3d0" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🎖 My Consignor License Card</text>

    <!-- Navigation items -->
    <g transform="translate(16, 175)">
      <rect width="208" height="40" rx="10" fill="#059669"/>
      <text x="20" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">📊  Dashboard</text>
      
