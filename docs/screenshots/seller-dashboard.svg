          <text x="20" y="55" fill="#64748b" font-family="sans-serif" font-size="11">Lot Ref: AH-LOT-771 • Clean Vested Title Escrowed</text>
          
          <rect x="520" y="16" width="150" height="52" rx="8" fill="#0f172a"/>
          <text x="532" y="35" fill="#64748b" font-family="sans-serif" font-size="10">TOP BID OFFER</text>
          <text x="532" y="58" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="900">₹64,12,500</text>

          <rect x="690" y="24" width="115" height="36" rx="8" fill="#059669"/>
          <text x="747" y="47" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Live Room &rarr;</text>
        </g>

        <!-- Table Row 2 -->
        <g transform="translate(20, 120)">
          <rect width="820" height="85" rx="10" fill="#020617" stroke="#1e293b"/>
          <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">Leica M3 Single Stroke Vintage Camera (1955)</text>
          <text x="20" y="55" fill="#64748b" font-family="sans-serif" font-size="11">Lot Ref: AH-LOT-518 • Summicron 50mm f/2 Lens Included</text>
          
          <rect x="520" y="16" width="150" height="52" rx="8" fill="#0f172a"/>
          <text x="532" y="35" fill="#64748b" font-family="sans-serif" font-size="10">TOP BID OFFER</text>
          <text x="532" y="58" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="900">₹3,24,900</text>

          <rect x="690" y="24" width="115" height="36" rx="8" fill="#059669"/>
          <text x="747" y="47" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Live Room &rarr;</text>
        </g>

        <!-- Table Row 3 -->
        <g transform="translate(20, 220)">
          <rect width="820" height="85" rx="10" fill="#020617" stroke="#1e293b"/>
          <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">First Edition "The Great Gatsby" (1925)</text>
          <text x="20" y="55" fill="#64748b" font-family="sans-serif" font-size="11">Lot Ref: AH-LOT-290 • Original Dust Jacket Preserved</text>
          
          <rect x="520" y="16" width="150" height="52" rx="8" fill="#0f172a"/>
          <text x="532" y="35" fill="#64748b" font-family="sans-serif" font-size="10">TOP BID OFFER</text>
          <text x="532" y="58" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="900">₹14,53,500</text>

          <rect x="690" y="24" width="115" height="36" rx="8" fill="#059669"/>
          <text x="747" y="47" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Live Room &rarr;</text>
        </g>
      </g>
    </g>
  </g>

  </g>
</svg>