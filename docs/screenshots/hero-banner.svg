<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="640" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="1200" height="42" rx="16" fill="#090d16"/>
  <rect y="30" width="1200" height="12" fill="#090d16"/>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>

  <!-- Address Bar -->
  <rect x="180" y="8" width="840" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="600" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">
    🔒 https://auctionhub.internal
  </text>

  <!-- Main Canvas -->
  <g transform="translate(0, 42)">
    
  <!-- Atmospheric Beams -->
  <circle cx="300" cy="150" r="280" fill="#3b82f6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="900" cy="220" r="260" fill="#8b5cf6" opacity="0.12" filter="blur(60px)"/>

  <!-- Navigation Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#020617" opacity="0.8"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#1e293b"/>
  <g transform="translate(48, 16)">
    <rect width="30" height="30" rx="8" fill="#10b981" opacity="0.2"/>
    <text x="7" y="21" fill="#10b981" font-size="18">🔨</text>
    <text x="38" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="18">AuctionHub</text>
  </g>
  <g transform="translate(900, 15)">
    <rect width="110" height="32" rx="16" fill="#1e293b"/>
    <text x="55" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sign In</text>
    <rect x="120" width="130" height="32" rx="16" fill="#2563eb"/>
    <text x="185" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Register Free →</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <!-- Live Badge -->
    <rect x="-160" y="-30" width="320" height="28" rx="14" fill="#1e1b4b" stroke="#4338ca"/>
    <circle cx="-135" cy="-16" r="4" fill="#10b981"/>
    <text x="-120" y="-12" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="700">⚡ Real-Time WebSocket Engine 2.0 Active</text>

    <!-- Main Title -->
    <text y="35" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="-1">The Next-Gen Live Electronic</text>
    <text y="85" fill="#60a5fa" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Auction &amp; Statutory Deed Platform</text>
    <text y="125" fill="#94a3b8" font-family="sans-serif" font-size="16">Multi-Currency (INR ₹ / USD $ / EUR € / GBP £) • India SOGA 1930 &amp; US UCC §2-328 Compliant</text>
  </g>

  <!-- Live Showcase Cards in Hero -->
  <g transform="translate(80, 310)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="320" height="240" rx="16" fill="#0f172a" stroke="#1e293b"/>
      <rect width="320" height="6" rx="3" fill="#3b82f6"/>
      <text x="24" y="38" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">1971 Rolex Submariner</text>
      <text x="24" y="58" fill="#64748b" font-family="sans-serif" font-size="11">Lot Ref: AH-LOT-98214 • Grade A Vintage</text>
      
      <rect x="24" y="75" width="272" height="70" rx="10" fill="#020617" stroke="#1e293b"/>
      <text x="40" y="98" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">CURRENT LEADING OFFER</text>
      <text x="40" y="130" fill="#60a5fa" font-family="sans-serif" font-size="26" font-weight="900">₹8,12,250 <tspan fill="#64748b" font-size="13">($9,500)</tspan></text>

      <text x="24" y="172" fill="#cbd5e1" font-family="sans-serif" font-size="11">⏱ Closes in: <tspan fill="#f59e0b" font-weight="700">02h 45m 12s</tspan></text>
      <text x="24" y="195" fill="#10b981" font-family="sans-serif" font-size="11">✓ Verified Seller Title Deed Escrowed</text>
      
      <rect x="24" y="206" width="272" height="2" fill="#1e293b"/>
    </g>

    <!-- Card 2 (Center Active Spotlight) -->
    <g transform="translate(360, -20)">
      <rect width="320" height="260" rx="16" fill="#091122" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
      <rect width="320" height="6" rx="3" fill="#10b981"/>
      <rect x="230" y="16" width="70" height="20" rx="10" fill="#064e3b"/>
      <text x="265" y="30" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">LIVE BIDDING</text>

      <text x="24" y="44" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="800">Rare 1952 Topps Mickey Mantle</text>
      <text x="24" y="64" fill="#94a3b8" font-family="sans-serif" font-size="11">PSA 8 NM-MT • Central Provenance Registry</text>
      
      <rect x="24" y="80" width="272" height="80" rx="10" fill="#020617" stroke="#1e293b"/>
      <text x="40" y="103" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">HAMMER PRICE (HIGHEST BID)</text>
      <text x="40" y="140" fill="#34d399" font-family="sans-serif" font-size="30" font-weight="900">₹42,75,000</text>
      <text x="240" y="140" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">$50,000</text>

      <rect x="24" y="175" width="272" height="34" rx="8" fill="#1e293b"/>
      <text x="160" y="197" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ 32 Bids Placed by 14 Qualified Buyers</text>
      
      <rect x="24" y="218" width="272" height="32" rx="8" fill="#2563eb"/>
      <text x="160" y="239" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">Place Instant Bid Now</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(720, 0)">
      <rect width="320" height="240" rx="16" fill="#0f172a" stroke="#1e293b"/>
      <rect width="320" height="6" rx="3" fill="#8b5cf6"/>
      <text x="24" y="38" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">1886 Morgan Silver Dollar</text>
      <text x="24" y="58" fill="#64748b" font-family="sans-serif" font-size="11">Lot Ref: AH-LOT-44109 • MS-65 Uncirculated</text>
      
      <rect x="24" y="75" width="272" height="70" rx="10" fill="#020617" stroke="#1e293b"/>
      <text x="40" y="98" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">CURRENT LEADING OFFER</text>
      <text x="40" y="130" fill="#c084fc" font-family="sans-serif" font-size="26" font-weight="900">₹2,39,400 <tspan fill="#64748b" font-size="13">($2,800)</tspan></text>

      <text x="24" y="172" fill="#cbd5e1" font-family="sans-serif" font-size="11">⏱ Closes in: <tspan fill="#f59e0b" font-weight="700">14h 20m 00s</tspan></text>
      <text x="24" y="195" fill="#10b981" font-family="sans-serif" font-size="11">✓ UCC §2-328 Auction Sale Compliant</text>
    </g>
  </g>

  </g>
</svg>