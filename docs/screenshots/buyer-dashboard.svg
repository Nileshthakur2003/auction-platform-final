    <text x="0" y="44" fill="#94a3b8" font-family="sans-serif" font-size="12">Live competitive auctions and personal bidding overview</text>

    <!-- Explore Button -->
    <rect x="680" y="6" width="180" height="40" rx="10" fill="#2563eb"/>
    <text x="770" y="31" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore All Listings ↗</text>

    <!-- 3 Stats Cards -->
    <g transform="translate(0, 70)">
      <rect width="270" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="32" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="700">LIVE AUCTIONS</text>
      <text x="20" y="74" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900">12</text>
      <text x="20" y="94" fill="#64748b" font-family="sans-serif" font-size="10">Available for live bidding</text>

      <g transform="translate(295, 0)">
        <rect width="270" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
        <text x="20" y="32" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">TOTAL OFFERS PLACED</text>
        <text x="20" y="74" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900">27</text>
        <text x="20" y="94" fill="#64748b" font-family="sans-serif" font-size="10">Total bids submitted across lots</text>
      </g>

      <g transform="translate(590, 0)">
        <rect width="270" height="110" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="20" y="32" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="700">TOTAL WON &amp; SETTLED</text>
        <text x="20" y="72" fill="#c084fc" font-family="sans-serif" font-size="28" font-weight="900">₹79,45,088</text>
        <text x="20" y="94" fill="#64748b" font-family="sans-serif" font-size="10">Official Bills of Sale Executed</text>
      </g>
    </g>

    <!-- Live Listings Grid -->
    <g transform="translate(0, 210)">
      <text x="0" y="20" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">Active Live Listings</text>
      <rect x="710" y="4" width="150" height="22" rx="11" fill="#064e3b" stroke="#10b981"/>
      <circle cx="725" cy="15" r="4" fill="#10b981"/>
      <text x="735" y="19" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="800">WebSocket Synchronized</text>

      <!-- 3 Cards -->
      <g transform="translate(0, 36)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="270" height="340" rx="14" fill="#0f172a" stroke="#1e293b"/>
          <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">Rolex Submariner</text>
          <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="11">Grade A Vintage • 1971</text>
          
          <rect x="20" y="70" width="230" height="70" rx="10" fill="#020617" stroke="#1e293b"/>
          <text x="32" y="92" fill="#64748b" font-family="sans-serif" font-size="10">CURRENT TOP BID</text>
          <text x="32" y="122" fill="#60a5fa" font-family="sans-serif" font-size="22" font-weight="900">₹8,12,250</text>

          <text x="20" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="11">👥 <tspan font-weight="700">14 bidders</tspan> • ⏱ <tspan fill="#f59e0b">02h 45m</tspan></text>
          <rect x="20" y="275" width="230" height="44" rx="10" fill="#2563eb"/>
          <text x="135" y="302" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Place Bid Now</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(295, 0)">
          <rect width="270" height="340" rx="14" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" filter="url(#cardShadow)"/>
          <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">1952 Mickey Mantle</text>
          <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="11">PSA 8 NM-MT • Historic</text>
          
          <rect x="20" y="70" width="230" height="70" rx="10" fill="#020617" stroke="#1e293b"/>
          <text x="32" y="92" fill="#64748b" font-family="sans-serif" font-size="10">CURRENT TOP BID</text>
          <text x="32" y="122" fill="#34d399" font-family="sans-serif" font-size="22" font-weight="900">₹42,75,000</text>

          <text x="20" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="11">👥 <tspan font-weight="700">32 bidders</tspan> • ⏱ <tspan fill="#f59e0b">04h 12m</tspan></text>
          <rect x="20" y="275" width="230" height="44" rx="10" fill="#2563eb"/>
          <text x="135" y="302" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Increase Bid Now</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(590, 0)">
          <rect width="270" height="340" rx="14" fill="#0f172a" stroke="#1e293b"/>
          <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">1886 Morgan Dollar</text>
          <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="11">MS-65 Uncirculated Silver</text>
          
          <rect x="20" y="70" width="230" height="70" rx="10" fill="#020617" stroke="#1e293b"/>
          <text x="32" y="92" fill="#64748b" font-family="sans-serif" font-size="10">CURRENT TOP BID</text>
          <text x="32" y="122" fill="#c084fc" font-family="sans-serif" font-size="22" font-weight="900">₹2,39,400</text>

          <text x="20" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="11">👥 <tspan font-weight="700">9 bidders</tspan> • ⏱ <tspan fill="#f59e0b">14h 20m</tspan></text>
          <rect x="20" y="275" width="230" height="44" rx="10" fill="#2563eb"/>
          <text x="135" y="302" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Place Bid Now</text>
        </g>
      </g>
    </g>
  </g>

  </g>
</svg>