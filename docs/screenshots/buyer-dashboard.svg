<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="680" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="1200" height="42" rx="16" fill="#090d16"/>
  <rect y="30" width="1200" height="12" fill="#090d16"/>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>

  <!-- Address Bar -->
  <rect x="180" y="8" width="840" height="26" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="600" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" text-anchor="middle">
    🔒 https://auctionhub.internal/buyer
  </text>

  <!-- Main Canvas -->
  <g transform="translate(0, 42)">
    
  <!-- Sidebar -->
  <g transform="translate(0, 0)">
    <rect width="240" height="638" fill="#020617"/>
    <line x1="240" y1="0" x2="240" y2="638" stroke="#1e293b"/>

    <g transform="translate(24, 24)">
      <rect width="32" height="32" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="8" y="22" fill="#60a5fa" font-size="16">🔨</text>
      <text x="42" y="16" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">AuctionHub</text>
      <text x="42" y="30" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="700">BUYER PORTAL</text>
    </g>

    <!-- User Card -->
    <rect x="16" y="74" width="208" height="84" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="28" y="94" fill="#64748b" font-family="sans-serif" font-size="10">Signed in as</text>
    <text x="28" y="112" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">nilesh_bidder</text>
    <rect x="28" y="124" width="184" height="24" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="120" y="140" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🎖 My Bidder Pass (Class-I)</text>

    <!-- Navigation items -->
    <g transform="translate(16, 175)">
      <rect width="208" height="40" rx="10" fill="#2563eb"/>
      <text x="20" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">📊  Dashboard</text>
      
      <g transform="translate(0, 48)">
        <rect width="208" height="40" rx="10" fill="transparent"/>
        <text x="20" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">🔍  Explore All Auctions</text>
      </g>
      <g transform="translate(0, 96)">
        <rect width="208" height="40" rx="10" fill="transparent"/>
        <text x="20" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">🔥  My Active Bids</text>
      </g>
      <g transform="translate(0, 144)">
        <rect width="208" height="40" rx="10" fill="transparent"/>
        <text x="20" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">📜  Bidding Ledger</text>
      </g>
      <g transform="translate(0, 192)">
        <rect width="208" height="40" rx="10" fill="transparent"/>
        <text x="20" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">👤  Buyer Profile</text>
      </g>
      <g transform="translate(0, 240)">
        <rect width="208" height="40" rx="10" fill="transparent"/>
        <text x="20" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">⚖️  Terms &amp; Legal</text>
      </g>
    </g>

    <!-- Currency Selector -->
    <rect x="16" y="560" width="208" height="50" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="28" y="582" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">CURRENCY ACTIVE:</text>
    <rect x="28" y="588" width="184" height="24" rx="6" fill="#1e293b"/>
    <text x="40" y="604" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="800">₹ INR - Indian Rupee (85.50)</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(270, 24)">
